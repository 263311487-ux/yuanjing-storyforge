name: CI
on: [push, pull_request]
env:
  PYTHONIOENCODING: utf-8
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install .
      - run: python -c "import ai_comic_drama; print(ai_comic_drama.__file__)"
      - run: python scripts/validate_manifest.py examples/episode.json
      - run: python scripts/validate_manifest.py examples/episode.json --strict
      - run: python scripts/continuity_check.py examples/episode.json --json
      - run: python scripts/doctor.py --workdir work/ci-work
      - run: python scripts/check_compliance.py examples/episode.json
      - run: python scripts/previz.py examples/episode.json --out work/ci-previz.html
      - run: python scripts/estimate_cost.py examples/episode.json --rate 0.35 --pass-rate 0.65 --versions 3
      - run: python scripts/qa_report.py --manifest examples/episode.json --out work/ci-qa.json
      - run: python scripts/quickstart.py examples/episode.json --out work/ci-quickstart
      - run: python -m unittest discover -s tests -p 'test_*.py'
