<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }</style>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080810"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="film-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1030"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <pattern id="grain4" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="transparent"/>
      <circle cx="1.5" cy="1.5" r="0.5" fill="#ffffff" opacity="0.02"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg4)"/>
  <rect width="1280" height="640" fill="url(#grain4)"/>
  <rect x="0" y="0" width="3" height="640" fill="#a78bfa" opacity="0.8"/>

  <!-- Film strip top -->
  <rect x="0" y="0" width="1280" height="16" fill="#0a0812"/>
  <rect x="0" y="624" width="1280" height="16" fill="#0a0812"/>
  <!-- Film holes -->
  <g fill="#1e1b2e">
    <rect x="8" y="2" width="12" height="12" rx="2"/>
    <rect x="28" y="2" width="12" height="12" rx="2"/>
    <rect x="48" y="2" width="12" height="12" rx="2"/>
