  <text x="426" y="362" font-size="14" fill="#4b5563">→</text>

  <rect x="442" y="334" width="100" height="48" rx="4" fill="#1e1b2e" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="492" y="354" font-size="9" fill="#22c55e" text-anchor="middle" letter-spacing="0.5">GENERATE</text>
  <text x="492" y="370" font-size="11" fill="#e2e8f0" text-anchor="middle">Explicit opt-in</text>

  <text x="552" y="362" font-size="14" fill="#4b5563">→</text>

