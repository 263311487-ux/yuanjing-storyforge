  <text x="618" y="354" font-size="9" fill="#4facfe" text-anchor="middle" letter-spacing="0.5">APPROVE</text>
  <text x="618" y="370" font-size="11" fill="#e2e8f0" text-anchor="middle">Hash-bound</text>

