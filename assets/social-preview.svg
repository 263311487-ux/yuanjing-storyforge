  <text x="892" y="202" font-size="11" fill="#64748b">      "dialogue":</text>
  <text x="998" y="202" font-size="11" fill="#86efac">"系统崩溃了。"</text>
  <text x="892" y="220" font-size="11" fill="#64748b">      "status":</text>
  <text x="982" y="220" font-size="11" fill="#fde68a">"PENDING"</text>
  <text x="880" y="238" font-size="11" fill="#e879f9">    }</text>
  <text x="868" y="256" font-size="11" fill="#64748b">  ],</text>
  <text x="868" y="274" font-size="11" fill="#64748b">  "provider":</text>
  <text x="960" y="274" font-size="11" fill="#86efac">"seedance"</text>
  <text x="868" y="292" font-size="11" fill="#64748b">  "execute":</text>
  <text x="954" y="292" font-size="11" fill="#f87171">false</text>
  <text x="856" y="310" font-size="11" fill="#e879f9">}</text>

  <line x1="856" y1="328" x2="1204" y2="328" stroke="#1e1b2e" stroke-width="1"/>

  <text x="856" y="350" font-size="10" fill="#64748b">$ python scripts/quickstart.py</text>
  <text x="856" y="370" font-size="10" fill="#22c55e">✓ manifest validated</text>
  <text x="856" y="388" font-size="10" fill="#22c55e">✓ previz.html generated</text>
  <text x="856" y="406" font-size="10" fill="#22c55e">✓ assembly.json: blocked</text>
  <text x="856" y="424" font-size="10" fill="#fde68a">→ READY_FOR_PROVIDER_REVIEW</text>
