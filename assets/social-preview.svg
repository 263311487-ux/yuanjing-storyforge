    <rect x="8" y="626" width="12" height="12" rx="2"/>
    <rect x="28" y="626" width="12" height="12" rx="2"/>
    <rect x="48" y="626" width="12" height="12" rx="2"/>
    <rect x="68" y="626" width="12" height="12" rx="2"/>
    <rect x="88" y="626" width="12" height="12" rx="2"/>
